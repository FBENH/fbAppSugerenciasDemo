name: Build, test and deploy

on:
  push:
    branches: [ "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  AZURE_WEBAPP_NAME: fbappsugerenciasdemo

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      # Los tests de acceso a datos levantan MongoDB con Testcontainers (Docker viene instalado en ubuntu-latest).
      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Publish
        if: github.event_name != 'pull_request'
        run: dotnet publish AppSugerenciasUI/AppSugerenciasUI.csproj --configuration Release --no-build --output ./publish

      - name: Upload artifact for deployment job
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: ./publish

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    permissions:
      contents: none
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Development'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: app

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
