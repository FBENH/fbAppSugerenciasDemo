<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sugerencias · Iniciar sesión</title>
    <!--
        Plantilla para las páginas de Azure AD B2C (login, registro, cambio de contraseña, editar perfil).
        B2C reemplaza el div #api con su formulario. Los estilos van acá adentro porque B2C solo carga este HTML.
    -->
    <style>
        :root {
            color-scheme: light dark;
            --bg: #f6f7f9; --surface: #ffffff; --surface-2: #f1f3f6; --border: #e3e6eb; --border-strong: #cfd4dc;
            --text: #151a23; --text-2: #4d5665; --text-3: #6f7889;
            --accent: #4f46e5; --accent-hover: #4338ca; --accent-soft: #eef0ff; --accent-text: #ffffff;
            --danger: #c81e1e; --danger-soft: #fdecec;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0d1117; --surface: #151b24; --surface-2: #1c2430; --border: #262f3c; --border-strong: #354152;
                --text: #e8ecf2; --text-2: #b0b9c6; --text-3: #8a95a5;
                --accent: #818cf8; --accent-hover: #a5b4fc; --accent-soft: #23264a; --accent-text: #0d1117;
                --danger: #f87171; --danger-soft: #3a1c1f;
            }
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; background: var(--bg); color: var(--text);
            font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }

        .shell { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 48px 16px; }
        .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.1rem; color: var(--text); margin-bottom: 24px; }
        .brand-mark { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 9px; background: var(--accent); color: var(--accent-text); }
        .card { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
            padding: 28px; box-shadow: 0 1px 2px rgba(16,24,40,.05), 0 4px 12px rgba(16,24,40,.06); }
        .demo-note { width: 100%; max-width: 420px; margin-top: 16px; padding: 12px 14px; border-radius: 10px;
            background: var(--surface-2); color: var(--text-2); font-size: .86rem; }
        .demo-note code { font-size: .85rem; color: var(--text); }

        /* Contenido que genera B2C dentro de #api */
        #api h1, #api h2 { font-size: 1.3rem; margin: 0 0 6px; }
        #api .intro p, #api .intro h2 { margin: 0 0 18px; color: var(--text-2); font-size: .95rem; font-weight: 400; }
        #api .heading h1 { margin-bottom: 18px; }
        #api ul { list-style: none; margin: 0; padding: 0; }
        #api .entry-item, #api .attrEntry { margin-bottom: 16px; }
        #api label { display: block; font-weight: 600; font-size: .9rem; margin-bottom: 6px; }
        #api input[type=email], #api input[type=password], #api input[type=text], #api select {
            width: 100%; height: 40px; padding: 0 12px; border: 1px solid var(--border-strong); border-radius: 8px;
            background: var(--surface); color: var(--text); font: inherit; }
        #api input:focus, #api select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
        #api .password-label { display: flex; justify-content: space-between; align-items: baseline; }
        #api .password-label a { font-size: .85rem; }
        #api .buttons { margin-top: 20px; display: flex; gap: 8px; flex-wrap: wrap; }
        #api button {
            flex: 1; height: 40px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--accent);
            background: var(--accent); color: var(--accent-text); font: inherit; font-weight: 600; cursor: pointer; }
        #api button:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
        #api button#cancel, #api button.secondary, #api .buttons button[aria-label*="ancel"] {
            background: transparent; color: var(--text-2); border-color: var(--border-strong); }
        #api .create { margin-top: 18px; text-align: center; color: var(--text-2); font-size: .92rem; }
        #api .divider { margin: 20px 0; text-align: center; color: var(--text-3); font-size: .85rem; }
        #api .error { color: var(--danger); font-size: .85rem; }
        #api .error.pageLevel { background: var(--danger-soft); padding: 10px 12px; border-radius: 8px; margin-bottom: 14px; }
        #api .error[aria-hidden="true"], #api .error:empty { display: none; }
        #api .helpLink { display: none; }
        #api .verificationInfoText, #api .verificationSuccessText { color: var(--text-2); font-size: .88rem; }
    </style>
</head>
<body>
    <div class="shell">
        <div class="brand">
            <span class="brand-mark">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" /><path d="m9 11 3-3 3 3" />
                </svg>
            </span>
            Sugerencias
        </div>
        <div class="card">
            <div id="api"></div>
        </div>
        <p class="demo-note">
            Para probar como administrador: <code>testeoAppSugerencias@outlook.com</code> / <code>AppSugerencias1</code>
        </p>
    </div>
</body>
</html>
